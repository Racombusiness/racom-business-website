<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply Now - Join Our Team | Racom Business</title>
<meta name="description" content="Apply for open positions at Racom Business. Upload your resume and tell us why you want to join our team.">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4A90D9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#060E1C;--navy2:#0A1628;--navy3:#0D1E35;
  --blue:#4A90D9;--blue2:#3578C4;--blue3:#6AAEE8;
  --teal:#00BCD4;--muted:rgba(255,255,255,0.55);
  --bdd:rgba(255,255,255,0.07);
}
body{font-family:'Inter',sans-serif;background:var(--navy);color:#fff;line-height:1.6}
.container{max-width:1200px;margin:0 auto;padding:4rem 2rem}
h1{font-size:3rem;margin-bottom:1.5rem;color:var(--blue3)}
h2{font-size:2rem;margin:2rem 0 1rem;color:#fff}
p{margin-bottom:1rem;color:var(--muted);line-height:1.8}
.btn-blue{background:var(--blue);color:#fff;padding:12px 28px;border-radius:4px;text-decoration:none;display:inline-block;font-weight:700}
</style>

</head>
<body>
<div class="topbar">
  <div class="tb-left">
    <a href="tel:8662201422">(866) 220-1422</a>
    <span class="tb-sep">|</span>
    <a href="mailto:salessupport@racombusiness.com">salessupport@racombusiness.com</a>
  </div>
</div>
<nav>
  <a class='nav-logo-wrap' href='/'>
    <img loading="lazy" src="logo-racom.svg" alt="Racom Business" height="52" width="auto">
  </a>
  <div class="nav-menu">
    <!-- Navigation items -->
  </div>
</nav>

<div class="container">

<h1>Apply Now</h1>
<p>Join the Racom team! Fill out the form below to apply for any open position.</p>

<form style="max-width:600px;margin:2rem 0">
  <div style="margin-bottom:1rem">
    <label style="display:block;margin-bottom:0.5rem">Position Applying For</label>
    <select style="width:100%;padding:10px;border-radius:4px;border:1px solid var(--bdd);background:rgba(255,255,255,0.05);color:#fff">
      <option>Account Executive</option>
      <option>Field Engineer</option>
      <option>NOC Technician</option>
      <option>Project Manager</option>
      <option>Sales Representative</option>
      <option>Other</option>
    </select>
  </div>
  
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
    <div>
      <label style="display:block;margin-bottom:0.5rem">First Name *</label>
      <input type="text" required style="width:100%;padding:10px;border-radius:4px;border:1px solid var(--bdd);background:rgba(255,255,255,0.05);color:#fff">
    </div>
    <div>
      <label style="display:block;margin-bottom:0.5rem">Last Name *</label>
      <input type="text" required style="width:100%;padding:10px;border-radius:4px;border:1px solid var(--bdd);background:rgba(255,255,255,0.05);color:#fff">
    </div>
  </div>
  
  <div style="margin-bottom:1rem">
    <label style="display:block;margin-bottom:0.5rem">Email *</label>
    <input type="email" required style="width:100%;padding:10px;border-radius:4px;border:1px solid var(--bdd);background:rgba(255,255,255,0.05);color:#fff">
  </div>
  
  <div style="margin-bottom:1rem">
    <label style="display:block;margin-bottom:0.5rem">Phone *</label>
    <input type="tel" required style="width:100%;padding:10px;border-radius:4px;border:1px solid var(--bdd);background:rgba(255,255,255,0.05);color:#fff">
  </div>
  
  <div style="margin-bottom:1rem">
    <label style="display:block;margin-bottom:0.5rem">LinkedIn Profile URL</label>
    <input type="url" style="width:100%;padding:10px;border-radius:4px;border:1px solid var(--bdd);background:rgba(255,255,255,0.05);color:#fff">
  </div>
  
  <div style="margin-bottom:1rem">
    <label style="display:block;margin-bottom:0.5rem">Cover Letter / Why Racom?</label>
    <textarea rows="5" style="width:100%;padding:10px;border-radius:4px;border:1px solid var(--bdd);background:rgba(255,255,255,0.05);color:#fff"></textarea>
  </div>
  
  <div style="margin-bottom:1.5rem">
    <label style="display:block;margin-bottom:0.5rem">Upload Resume (PDF, DOC, DOCX) *</label>
    <input type="file" accept=".pdf,.doc,.docx" required style="width:100%;padding:10px;border-radius:4px;border:1px solid var(--bdd);background:rgba(255,255,255,0.05);color:#fff">
  </div>
  
  <button type="submit" class="btn-blue" style="width:100%;padding:14px;font-size:16px">Submit Application</button>
</form>

<p style="font-size:14px;color:rgba(255,255,255,0.4);margin-top:2rem">By submitting this application, you agree to our privacy policy and consent to be contacted regarding your application.</p>

</div>
</body>
</html>
